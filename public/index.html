<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KnowledgeAgent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l1.2 5.2L18 9.5l-4.8 1.3L12 16l-1.2-5.2L6 9.5l4.8-1.3L12 3z" fill="currentColor"/><path d="M18.5 14.5l.6 2.4 2.4.6-2.4.6-.6 2.4-.6-2.4-2.4-.6 2.4-.6.6-2.4z" fill="currentColor" opacity=".85"/></svg>
        </span>
        <div>
          <h1>KnowledgeAgent</h1>
          <p id="subtitle">GenAI document writer for custom Copilot agents</p>
        </div>
      </div>
      <span id="providerBadge" class="badge">connecting…</span>
    </header>

    <main class="layout">
      <section class="chat" aria-label="Conversation">
        <div id="messages" class="messages" role="log" aria-live="polite"></div>
        <form id="composer" class="composer">
          <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose Excel file">
            <input id="file" type="file" accept=".xlsx" hidden>
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="17" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span id="dropText">Drop an .xlsx file here or click to choose</span>
          </div>
          <div class="row">
            <div class="agent-picker">
              <span class="field-label">Custom agent</span>
              <label class="agent-btn">
                <span class="agent-ico">
                  <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="8" width="16" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="13" r="1.3" fill="currentColor"/><circle cx="15" cy="13" r="1.3" fill="currentColor"/></svg>
                </span>
                <select id="agent"></select>
                <span class="chevron" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </label>
              <p id="agentDesc" class="hint"></p>
            </div>
            <button id="go" type="submit" class="primary" disabled>Generate document</button>
          </div>
        </form>
      </section>

      <aside class="usage" aria-label="Token usage">
        <h2>Token usage</h2>
        <div class="totals">
          <div><span id="tPrompt">0</span><small>Prompt</small></div>
          <div><span id="tCompletion">0</span><small>Completion</small></div>
          <div><span id="tTotal">0</span><small>Total</small></div>
        </div>
        <p id="usageNote" class="hint">No model calls yet.</p>
        <table>
          <thead><tr><th>Step</th><th class="num">In</th><th class="num">Out</th><th class="num">Time</th></tr></thead>
          <tbody id="calls"></tbody>
        </table>
      </aside>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
